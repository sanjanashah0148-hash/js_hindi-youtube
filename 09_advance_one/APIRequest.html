<script>
    const requestUrl='https://api.github.com/users/sanjanashah0148'
    const xhr=new XMLHttpRequest();
    xhr.open('GET',requestUrl)
    xhr.onreadystatechange=function(){
        console.log(xhr.readyState);
        if(xhr.readyState===4){
             const data=JSON.parse(this.responseText)//this actually tells us for this response text
             //JSON is used to convert to JSON datatype 
             //this is actually for current context
             console.log(typeof(data));
             console.log(data.followers);
         }
         //document is actually not part of core javascript
    }
    //JS actually run by C++,it is actually a wrapper to core C++
    //console.log("Here");
    xhr.send()
